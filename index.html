  <div class="share" style="margin-top:14px"><code>${esc(linkVotar(c))}</code><button class="btn sm" onclick="copiarLink('${c.id}')">Copiar enlace</button><a class="btn sm" target="_blank" rel="noopener" href="${waLink(c)}">Mandar por WhatsApp</a><button class="btn ghost sm danger" onclick="borrarVotos('${c.id}')">Borrar votos</button></div>
  <div class="grid g3" style="margin:18px 0">${ps.map(p=>{ const ok=completo(p); const alguno=!!papel(p); return `<div class="paper ${ok?'down':''}"><div style="font-weight:600;font-size:17px;${ok?'color:var(--tx2)':''}">${esc(p)}</div>${papel(p)?.nombre?`<div class="small" style="color:var(--tx2)">${esc(papel(p).nombre)}</div>`:''}<div class="small ${ok?'':'muted'}">${ok?'Papel boca abajo':alguno?'Está anotando…':'Todavía no votó'}</div><button class="btn ghost sm" style="margin-top:10px" onclick="votante='${esc(p)}';render()">${ok?'Ver / corregir':'Votar por él'}</button></div>`; }).join('')}</div>
  <hr>
  <div class="row"><button class="btn pri" ${ps.some(p=>completo(p))?'':'disabled'} onclick="revelarSeguro('${c.id}')">Dar vuelta todos los papeles</button>${!todos?`<span class="muted small">Votaron ${ps.filter(p=>completo(p)).length} de ${ps.length}. Podés darlos vuelta igual: cuentan solo los papeles completos.</span>`:''}</div>`;
}
function elegirRol(campId,p){
  const n=(document.getElementById('v-nombre')?.value||'').trim(); if(!n){ toast('Poné tu nombre primero'); document.getElementById('v-nombre')?.focus(); return; }
  const pv=papel(p); if(pv?.nombre&&pv.nombre.toLowerCase()!==n.toLowerCase()&&!confirm(`${p} ya lo tomó ${pv.nombre}. ¿Seguro que sos vos? Si entrás, pisás su papel.`)) return;
  NOMBRE=n; localStorage.setItem('ideamia_nombre',n); localStorage.setItem('ideamia_quien_'+campId,p); QUIEN=p; ultimoJSON='';
  // se registra el nombre enseguida, así el DC y los demás ven el rol tomado
  let v=papel(p); if(!v){ v={campanaId:campId,participante:p,notas:{},completo:false}; V.push(v); } v.nombre=n;
  api('POST','voto',{campanaId:campId,participante:p,nombre:n,dev:DEV,notas:v.notas||{}}).catch(e=>toast(e.message));
  render(); }
function cambiarRol(campId){ localStorage.setItem('ideamia_quien_'+campId,'-'); QUIEN=''; render(); }
function revelarSeguro(id){ const c=byId(S.campanas,id); const ps=c.participantes||[]; const f=ps.filter(p=>!completo(p)); if(f.length&&!confirm(`Faltan ${f.join(', ')}. ¿Dar vuelta igual? Cuentan solo los papeles completos.`)) return; revelar(id); }
async function revelar(id){ const c=byId(S.campanas,id); confeti(); c.revelado=true; c.reveladoEn=new Date().toISOString(); tab='resultados'; render(); await save(); ultimoJSON=''; await cargar(); }
function reabrir(id){ const c=byId(S.campanas,id); c.revelado=false; save(); render(); }

/* ---------------- resultados ---------------- */
function tabResultados(c){
  if(!c.revelado) return `<div class="empty">Las notas aparecen cuando el DC da vuelta todos los papeles a la vez.</div>`;
  const res=calc(c); const dobles=c.dobles||[]; const maxP=Q.reduce((a,q)=>a+5*(dobles.includes(q.k)?2:1),0);
  const obs=observaciones(c,res); const ideas=ideasDe(c.id);
  // podio: la primera gigante, el resto en fila con barra de puntaje
  const podio=res.length?`<div class="podio">
    <div class="podio-1"><span class="pos">1º</span><div class="kicker" style="color:var(--ban-ink)">— La que más puntaje sacó</div><div class="pn">${esc(res[0].idea.nombre)}</div><div class="pt"><b data-count="${res[0].total}">${res[0].total}</b><span>/ ${maxP}</span></div><div class="small">${res[0].n} papel${res[0].n===1?'':'es'} · ${esc(res[0].idea.queSeVe||'')}</div></div>
    <div class="podio-resto">${res.slice(1).map((r,i)=>`<div class="podio-f"><span class="pos">${i+2}º</span><div class="grow"><div class="pn2">${esc(r.idea.nombre)}</div><div class="barra"><i style="width:${maxP?r.total/maxP*100:0}%"></i></div></div><b class="pt2">${r.total}</b></div>`).join('')}</div>
  </div>`:'';
  return `${podio}<p class="muted" style="margin-top:18px">Promedio de cada casillero. Las dos que cuentan doble, por 2. Se suma para abajo. Máximo posible: ${maxP}.</p>
  <div style="overflow-x:auto;margin-top:16px"><table class="tbl">
    <thead><tr><th></th>${res.map((r,i)=>`<th class="${i===0?'win':''}">${String.fromCharCode(65+ideas.indexOf(r.idea))} · ${esc(r.idea.nombre)}<span class="w">${r.n} papel${r.n===1?'':'es'}</span></th>`).join('')}</tr></thead>
    <tbody>${Q.map(q=>`<tr><td class="qn">${q.short}${dobles.includes(q.k)?'<span class="x2">×2</span>':''}<span class="w">${q.planilla}</span></td>${res.map((r,i)=>{ const cl=r.cells[q.k]; return `<td class="${i===0?'win':''}"><span class="avg">${r1(cl.avg)}</span>${cl.mult===2?`<span class="w">→ ${r1(cl.w)}</span>`:''}${cl.spread>=3?`<span class="spread">notas de ${Math.min(...cl.vals)} a ${Math.max(...cl.vals)}</span>`:''}</td>`; }).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td class="qn">Total</td>${res.map((r,i)=>`<td class="${i===0?'win':''}"><span class="tot">${r.total}</span></td>`).join('')}</tr></tfoot>
  </table></div>
  <h2>Qué nos dicen esos números</h2>
  ${obs.length?`<ul class="obs">${obs.map(o=>`<li class="${o.c}">${o.t}</li>`).join('')}</ul>`:'<p class="muted">Sin observaciones.</p>'}
  <details style="margin-top:22px"><summary class="muted" style="cursor:pointer">Ver nota por nota (quién puso qué)</summary>
    <div style="overflow-x:auto;margin-top:10px"><table class="tbl small"><thead><tr><th>Idea</th><th style="text-align:left">Pregunta</th>${(c.participantes||[]).map(p=>`<th>${esc(etq(p))}</th>`).join('')}</tr></thead>
    <tbody>${ideas.map(i=>Q.map((q,qi)=>`<tr>${qi===0?`<td class="qn" rowspan="5" style="vertical-align:top"><b>${esc(i.nombre)}</b></td>`:''}<td class="dim" style="text-align:left">${q.short}</td>${(c.participantes||[]).map(p=>`<td>${nota(i.id,p)[q.k]??'–'}</td>`).join('')}</tr>`).join('')).join('')}</tbody></table></div>
  </details>
  ${isDC()&&c.estado!=='cerrada'?`<div class="row" style="margin-top:26px"><button class="btn pri" onclick="tab='decision';render()">Pasar a elegir</button></div>`:''}`;
}

/* ---------------- decisión ---------------- */
function tabDecision(c){
  const ideas=ideasDe(c.id);
  if(!c.revelado){ const ps=c.participantes||[]; const ok=ps.filter(p=>completo(p));
    return isDC()?`<div class="empty">Primero se dan vuelta los papeles. Votaron ${ok.length} de ${ps.length}.<div style="margin-top:14px"><button class="btn pri" ${ok.length?'':'disabled'} onclick="revelarSeguro('${c.id}')">Dar vuelta los papeles ahora</button></div></div>`:`<div class="empty">Primero el DC da vuelta los papeles.</div>`; }
  if(c.estado==='cerrada'){ const d=c.decision; const vas=(d.vas||[d.va]).map(id=>byId(S.ideas,id)).filter(Boolean), gs=ideas.filter(i=>i.estado!=='va');
    return `<p class="muted">Decidido el ${fmtDate(d.fecha.slice(0,10))}.${d.porqueVa?` ${esc(d.porqueVa)}`:''}</p>
    <div class="dec" style="margin-top:14px">
      ${vas.map(va=>`<div class="card idea va"><h4>${vas.length>1?'Va':'La elegida'}</h4><div class="who">${esc(va.nombre)}</div><p class="small">${esc(va.queSeVe||'')}</p><p class="small muted">${esc(va.queEs||'')}</p></div>`).join('')}
      ${gs.length?`<div class="card idea guardada"><h4>${gs.length===1?'Va al cementerio':'Van al cementerio'}</h4>${gs.map(g=>`<div class="who" style="font-size:17px">${esc(g.nombre)}</div><p class="small muted">${esc(g.porqueGuardada||'')}</p>`).join('')}<a class="small" href="#/cementerio">Ver en el cementerio: se pueden usar en otra campaña</a></div>`:''}
    </div>
    <div class="row" style="margin-top:14px"><button class="btn" onclick="copiarResumen('${c.id}')">Copiar resumen para el equipo</button><span class="small muted">Para pegar en WhatsApp, Discord o Trello.</span></div>
    <h2>Antes de levantarse de la mesa</h2>
    <ul class="obs">${['La idea elegida tiene nombre y una frase que todos repetirían igual.','Alguien tiene el guion asignado, con día de entrega.','El día de rodaje está confirmado y anotado.','Las ideas que no entraron ya están en el cementerio, con la fecha. ✓','Las notas quedaron guardadas, para poder mirarlas cuando la pieza se publique. ✓'].map(t=>`<li>${t}</li>`).join('')}</ul>
    ${isDC()?`<div class="row" style="margin-top:20px"><button class="btn ghost sm" onclick="reabrirDecision('${c.id}')">Deshacer la decisión</button></div>`:''}`;
  }
  if(!isDC()) return `<div class="empty">La decisión la toma el DC. Cuando la confirme, aparece acá.</div>`;
  const res=calc(c); const top=res[0];
  const sel=decDe(c); const ch=decChequeo(c,res,sel);
  return `<p class="muted">Gana el número más alto salvo argumento fuerte y agarrado del brief; nadie toca el doble ahora. Pueden ir varias: marcá todas las que van. Las demás van al cementerio y quedan disponibles para otra campaña.</p>
  ${ch.empate?`<p class="tag warn" style="margin-top:12px">Empate en ${ch.empate}. Desempata el DC y dice en voz alta qué parte del brief resuelve mejor la que elige.</p>`:''}
  <div class="card" style="margin-top:18px">
    <h3 style="margin-top:0">¿Cuáles van? <span class="dim" style="font-weight:500">${sel.vas.length} elegida${sel.vas.length===1?'':'s'}</span></h3>
    <div class="grid" style="gap:8px;margin-bottom:16px">${res.map((r,i)=>{ const on=sel.vas.includes(r.idea.id); return `<button class="decop ${on?'on':''}" onclick="decToggle('${c.id}','${r.idea.id}')" aria-pressed="${on}"><span class="ck">${on?'✓':''}</span><span class="grow"><b>${esc(r.idea.nombre)}</b> <span class="small muted">${i+1}º lugar</span></span><b class="pts">${r.total}</b></button>`; }).join('')}</div>
    <label class="f"><span>Por qué ${ch.pide?`<span style="color:var(--warn)">(${ch.empate?'hay empate':'no son las de mayor puntaje'}: decí qué parte del brief resuelven mejor)</span>`:''}</span><textarea id="dec-porque" oninput="decSet('${c.id}','porqueVa',this.value,true)" placeholder="Sacó el número más alto y la mejor nota en “¿sirve?”, que acá contaba doble.">${esc(sel.porqueVa)}</textarea></label>
  </div>
  <div class="card" style="margin-top:14px"><h3 style="margin-top:0">Van al cementerio</h3>

const DEC={};   // borrador de la decisión por campaña (no se guarda hasta confirmar)
function decDe(c){ if(!DEC[c.id]){ const top=calc(c)[0]; DEC[c.id]={vas:top?[top.idea.id]:[],porqueVa:''}; } return DEC[c.id]; }
function decSet(id,k,v,noRender){ const c=byId(S.campanas,id); decDe(c)[k]=v; if(!noRender) render(); }
function decToggle(id,ideaId){ const d=decDe(byId(S.campanas,id)); d.vas=d.vas.includes(ideaId)?d.vas.filter(x=>x!==ideaId):[...d.vas,ideaId]; render(); }
// pide el porqué si las elegidas no son las de más puntaje, o si hay empate justo en el corte
function decChequeo(c,res,d){ const k=d.vas.length; const topK=res.slice(0,k).map(r=>r.idea.id);
  const distinto=k>0&&d.vas.some(id=>!topK.includes(id));
  const corte=k>0&&res[k]&&Math.abs(res[k-1].total-res[k].total)<0.05?res[k].total:0;
  const empate=corte||(k===0&&res[1]&&Math.abs(res[0].total-res[1].total)<0.05?res[0].total:0);
  return {distinto,empate,pide:distinto||!!corte}; }
function confirmarDecision(id){
  const c=byId(S.campanas,id); const res=calc(c); const d=decDe(c);
  if(!d.vas.length){ toast('Elegí al menos una'); return; }
  const ch=decChequeo(c,res,d);
  if(ch.pide&&!(d.porqueVa||'').trim()){ toast(ch.empate?'Hay empate: escribí en “Por qué” qué parte del brief resuelve mejor':'No son las de mayor puntaje: escribí en “Por qué” qué parte del brief resuelven mejor'); document.getElementById('dec-porque')?.focus(); return; }
  const vas=res.map(r=>r.idea.id).filter(x=>d.vas.includes(x));   // en orden de puntaje
  const resumen=Object.fromEntries(res.map(r=>[r.idea.id,{total:r.total,avg:Object.fromEntries(Q.map(q=>[q.k,r1(r.cells[q.k].avg)]))}]));
  ideasDe(id).forEach(i=>{ if(vas.includes(i.id)) i.estado='va'; else { i.estado='guardada'; i.porqueGuardada=(d['g_'+i.id]||'').trim(); i.guardadaEn=new Date().toISOString(); } });
  c.decision={va:vas[0],vas,acompana:null,porqueVa:(d.porqueVa||'').trim(),fecha:new Date().toISOString(),resumen};
  c.estado='cerrada'; delete DEC[c.id]; save(); render(); confeti(); toast(vas.length>1?`Van ${vas.length} ideas`:'Decisión guardada');
}

    otras.length?`Al cementerio: ${otras.map(i=>`${i.nombre} (${res[i.id]?.total??''})`).join(', ')}`:'' ].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n').trim();

  {x:'48%',y:'8%',r:'12deg',d:.3,c:'#F6B5D1',s:84,t:'1 · 3 · 5',k:'voto',cls:'lejos chau'},
];
function postits(){ return `<div class="vuelan" aria-hidden="true">${POSTITS.map((p,i)=>`<div class="vuela ${p.cls||''}" style="--x:${p.x};--y:${p.y};--r:${p.r};--d:${p.d}"><i style="--c:${p.c};--s:${p.s}px;--t:${6+i*1.3}s;--dl:${-i*1.7}s"><small>${p.k}</small>${p.t}</i></div>`).join('')}</div>`; }
function marquesina(){ const t='IDEAS ✦ CRUCES ✦ FINALES ✦ VOTO A CIEGAS ✦ EL BRIEF MANDA ✦ CEMENTERIO ✦ '; return `<div class="marq" aria-hidden="true"><div>${t.repeat(4)}${t.repeat(4)}</div></div>`; }
// la animación de entrada corre solo al cambiar de pantalla, no en cada refresco automático
let fxUltima='';
function fxEntrada(clave){ const app=document.getElementById('app'); const nueva=clave!==fxUltima; fxUltima=clave; app.classList.toggle('anim',nueva);
  document.body.classList.toggle('en-cem',(location.hash||'').startsWith('#/cementerio')&&!!ROLE);
  if(!nueva) return;
  app.querySelectorAll('.card,.tumba,.podio-f').forEach((el,i)=>el.style.setProperty('--i',Math.min(i,14)));
  app.querySelectorAll('[data-count]').forEach(contar); }
function contar(el){ const fin=parseFloat(el.dataset.count); if(!isFinite(fin)||fin<=0) return; const dec=String(el.dataset.count).includes('.')?1:0; const t0=performance.now(), dur=1000;
  const paso=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=(fin*e).toFixed(dec).replace('.',','); if(k<1) requestAnimationFrame(paso); else el.textContent=String(el.dataset.count).replace('.',','); };
  requestAnimationFrame(paso); }
function confeti(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; const c=document.createElement('div'); c.className='confeti'; const cols=['#FFF200','#FFFFFF','#FFC9A8','#A9D5F5','#B9E6A5','#DCC2F5'];
  c.innerHTML=Array.from({length:140},()=>`<i style="left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};--t:${2.2+Math.random()*2}s;--dl:${Math.random()*.6}s;--dx:${(Math.random()-.5)*260}px;--rot:${Math.random()*900-450}deg;width:${6+Math.random()*7}px"></i>`).join('');
  document.body.appendChild(c); setTimeout(()=>c.remove(),5200); }
// luz amarilla que sigue al mouse y post-its que se corren
addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse') return; const r=document.documentElement; r.style.setProperty('--sx',e.clientX+'px'); r.style.setProperty('--sy',e.clientY+'px');
  const v=document.querySelector('.vuelan'); if(v){ v.style.setProperty('--mx',(e.clientX/innerWidth-.5).toFixed(3)); v.style.setProperty('--my',(e.clientY/innerHeight-.5).toFixed(3)); } },{passive:true});

/* ---------------- zombies del cementerio ---------------- */
const ZPIEL=['#8FA37E','#9AAE7A','#7F9672','#A3B08A','#88A08A'], ZROPA=['#4A3B5C','#5C3B3B','#2F4A5C','#4D4D3A','#3A3A3A','#5C4A2F'];
function zombiSVG(i){ const piel=ZPIEL[i%ZPIEL.length], ropa=ZROPA[(i*3)%ZROPA.length], pant=['#2A2A36','#30261F','#22303A'][i%3];
  return `<svg viewBox="0 0 64 104" aria-hidden="true">
    <g class="pb"><rect x="27" y="64" width="7" height="30" rx="3" fill="${pant}"/><rect x="25" y="92" width="11" height="5" rx="2" fill="#1A1A1A"/></g>
    <g class="pa"><rect x="29" y="64" width="7" height="30" rx="3" fill="${pant}" opacity=".85"/><rect x="28" y="92" width="11" height="5" rx="2" fill="#151515"/></g>
    <path d="M20 38 Q20 32 26 32 H38 Q44 32 44 38 V66 L41 62 L38 67 L34 62 L30 67 L26 62 L22 67 L20 64 Z" fill="${ropa}"/>
    <g class="br"><rect x="32" y="38" width="28" height="7" rx="3.5" fill="${ropa}"/><rect x="50" y="38" width="12" height="7" rx="3.5" fill="${piel}"/>
      <rect x="30" y="45" width="26" height="6" rx="3" fill="${ropa}" opacity=".8"/><rect x="47" y="45" width="11" height="6" rx="3" fill="${piel}" opacity=".9"/></g>
    <circle cx="33" cy="20" r="12" fill="${piel}"/>
    <path d="M22 16 Q24 6 34 7 Q44 8 45 16 L41 12 L38 15 L35 10 L31 14 L27 10 Z" fill="#2B2B2B" opacity="${i%2?'.9':'.6'}"/>
    <circle class="ojo" cx="37" cy="19" r="2.3" fill="#FFF200"/><circle class="ojo" cx="30" cy="19.5" r="1.8" fill="#FFF200" opacity=".8"/>
    <path d="M29 27 Q33 25 39 27" stroke="#3A2A2A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M24 22 l3 2" stroke="#5E6E52" stroke-width="1.2"/>
  </svg>`; }
function horda(){ const n=9; return `<div class="horda" aria-hidden="true">${Array.from({length:n},(_,i)=>{ const prof=(i*37%10)/10;   // 0 = cerca, 1 = lejos
    const w=Math.round(100-prof*44), b=Math.round(12+prof*34), t=(26+prof*20+(i%3)*4).toFixed(1);
    return `<div class="zombi ${i%3===1?'izq':''}" style="--w:${w}px;--b:${b}px;--t:${t}s;--dl:${-(i*t/n*1.7).toFixed(1)}s;--z:${10-Math.round(prof*9)};--o:${(1-prof*.45).toFixed(2)}" onclick="zombiClick()" title="Esta idea quiere volver"><div>${zombiSVG(i)}</div></div>`; }).join('')}</div>`; }
function zombiClick(){ const items=[...document.querySelectorAll('.tumba[data-id]')]; if(!items.length){ toast('🧟 Grrr… todavía no hay ideas enterradas'); return; }
  const t=items[Math.floor(Math.random()*items.length)]; document.querySelectorAll('.tumba.destacada').forEach(x=>x.classList.remove('destacada'));
  t.classList.add('destacada'); t.scrollIntoView({behavior:'smooth',block:'center'}); toast(`🧟 “${t.dataset.nombre}” quiere volver`); setTimeout(()=>t.classList.remove('destacada'),3500); }
const MURCI=`<svg viewBox="0 0 34 14"><path d="M17 5 Q14 0 11 4 Q7 0 0 3 Q5 5 6 10 Q9 7 12 9 Q15 6 17 13 Q19 6 22 9 Q25 7 28 10 Q29 5 34 3 Q27 0 23 4 Q20 0 17 5Z" fill="#0A0A0A"/></svg>`;

/* ---------------- arranque ---------------- */
addEventListener("scroll",()=>{ const b=document.getElementById("progreso"); if(!b) return; const h=document.documentElement, m=h.scrollHeight-h.clientHeight; b.style.width=(m>0?Math.min(100,h.scrollTop/m*100):0)+"%"; },{passive:true});
if((location.hash||'').startsWith('#/votar/')) tab='votar';
if(!ROLE && (location.hash||'').startsWith('#/votar/')){ ROLE='votante'; sessionStorage.setItem('ideamia_role','votante'); }
render(); if(ROLE){ cargar(); poll(); } pollPizarron();
</script>
